name: TF-C Docker CI-CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Build Docker image and verify TF-C model
        run: docker build -t gesture-ai-tfc:ci .

      - name: Run application container
        run: |
          docker run -d --name gesture-ci \
            -p 127.0.0.1:8081:5000 \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            gesture-ai-tfc:ci

      - name: Check application and model readiness
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8081/api/health \
              -o health.json; then
              if python3 -c "import json; d=json.load(open('health.json')); assert d['model_ready'] is True and 'TF-C' in d['model']"; then
                cat health.json
                exit 0
              fi
            fi
            sleep 2
          done
          docker logs gesture-ci
          exit 1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" |
            docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push tested image to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="$DOCKERHUB_USERNAME/gesture-ai-tfc"
          docker tag gesture-ai-tfc:ci "$IMAGE:latest"
          docker tag gesture-ai-tfc:ci "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Show container logs
        if: always()
        run: docker logs gesture-ci 2>/dev/null || true

      - name: Clean up test container
        if: always()
        run: docker rm -f gesture-ci 2>/dev/null || true